<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Store</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b0c;--surface:#161618;--line:#2a2a2d;--text:#f5f5f0;--muted:#9a9aa2;--accent:#ff3b5c;--good:#3ddc84;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  *{box-sizing:inherit;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;}
  h1,.display{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px;}
  header{position:sticky;top:0;z-index:20;background:rgba(11,11,12,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;max-width:1100px;margin:0 auto;}
  .logo{font-family:'Anton',sans-serif;font-size:20px;}
  .cart-btn{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;cursor:pointer;display:flex;gap:8px;align-items:center;}
  .cart-count{background:var(--accent);color:#fff;border-radius:999px;min-width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:20px 20px 20px;max-width:1100px;margin:0 auto;scrollbar-width:none;}
  .chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  .chip.active{background:var(--text);color:#0b0b0c;border-color:var(--text);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;padding:0 20px 80px;max-width:1100px;margin:0 auto;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .thumb{aspect-ratio:1;background:linear-gradient(150deg,#1d1d20,#0e0e10);}
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .cat{color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;}
  .name{font-size:14px;font-weight:600;}
  .price{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:8px;}
  .add{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;}
  .empty-state{color:var(--muted);text-align:center;padding:60px 20px;font-size:14px;}
  .drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;}
  .drawer-backdrop.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,88vw);background:var(--bg);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .3s;z-index:31;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{display:flex;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);}
  .close{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;}
  .items{flex:1;overflow-y:auto;padding:12px 20px;}
  .item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;}
  .item-info{flex:1;} .item-info .n{font-size:14px;font-weight:600;} .item-info .p{color:var(--muted);font-size:13px;}
  .qty{display:flex;gap:8px;align-items:center;}
  .qty button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;}
  .drawer-foot{padding:18px 20px;border-top:1px solid var(--line);}
  .field-label{display:block;font-size:11px;color:var(--muted);font-weight:600;margin:8px 0 4px;}
  .field{width:100%;background:#0e0e10;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;font-size:13px;}
  .total{display:flex;justify-content:space-between;font-size:15px;margin:14px 0;}
  .checkout{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;}
  .checkout:disabled{opacity:.4;}
  .order-status{font-size:13px;margin-top:10px;} .order-status.ok{color:var(--good);} .order-status.err{color:var(--accent);}
  .note-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px;}
  .note-backdrop.open{opacity:1;pointer-events:auto;}
  .note-modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:380px;width:100%;padding:24px;text-align:center;}
  .note-modal h3{font-family:'Anton',sans-serif;font-size:20px;text-transform:uppercase;margin-bottom:12px;}
  .note-modal p{color:var(--muted);font-size:14px;line-height:1.5;margin-bottom:20px;white-space:pre-wrap;}
  .note-continue{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;}
  .note-continue:disabled{opacity:.4;}
</style>
</head>
<body>
<header><div class="nav">
  <div class="logo" id="brandName">Store</div>
  <button class="cart-btn" onclick="openDrawer()">Bag <span class="cart-count" id="cartCount">0</span></button>
</div></header>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"><div class="empty-state">Loading products…</div></div>

<div class="drawer-backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><h2>Your bag</h2><button class="close" onclick="closeDrawer()">&times;</button></div>
  <div class="items" id="itemsList"></div>
  <div class="drawer-foot">
    <label class="field-label">Name</label><input class="field" id="custName" placeholder="Your name">
    <label class="field-label">Phone</label><input class="field" id="custPhone" placeholder="01xxxxxxxxx">
    <label class="field-label">Address</label><input class="field" id="custAddress" placeholder="Area, street, building">
    <div class="total"><span>Total</span><b id="totalPrice">0 EGP</b></div>
    <button class="checkout" id="checkoutBtn" onclick="checkout()">Place order</button>
    <div class="order-status" id="orderStatus"></div>
  </div>
</div>

<div class="note-backdrop" id="noteBackdrop">
  <div class="note-modal"><h3>Before you go</h3><p id="noteText"></p>
    <button class="note-continue" id="noteContinueBtn" onclick="closeNote()">Continue</button></div>
</div>

<script>
// Same site as the backend, so plain relative paths work.
const BACKEND_URL = '';

let PRODUCTS = [], CATEGORIES = [], SETTINGS = {};
let activeCat = 'All';
let cart = {};

async function load(){
  try{
    const res = await fetch(BACKEND_URL + '/api/public/data');
    const data = await res.json();
    PRODUCTS = data.products || [];
    CATEGORIES = data.categories || [];
    SETTINGS = data.settings || {};
    renderFilters();
    renderGrid();
  }catch(err){
    document.getElementById('grid').innerHTML = '<div class="empty-state">Could not load products. Please refresh.</div>';
  }
}

function renderFilters(){
  const cats = ['All', ...CATEGORIES];
  document.getElementById('filters').innerHTML = cats.map(c =>
    `<button class="chip ${c===activeCat?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){ activeCat = c; renderFilters(); renderGrid(); }

function renderGrid(){
  const el = document.getElementById('grid');
  const list = activeCat==='All' ? PRODUCTS : PRODUCTS.filter(p=>p.category===activeCat);
  if(!list.length){ el.innerHTML = '<div class="empty-state">No products yet.</div>'; return; }
  el.innerHTML = list.map((p,i) => `
    <div class="card">
      <div class="thumb">${p.photo ? `<img src="${p.photo}">` : ''}</div>
      <div class="card-body">
        <div class="cat">${p.category||''}</div>
        <div class="name">${p.name}</div>
        <div class="price"><b>${p.price} EGP</b><button class="add" onclick="addToCart(${PRODUCTS.indexOf(p)})">Add</button></div>
      </div>
    </div>`).join('');
}

function addToCart(idx){ cart[idx] = (cart[idx]||0)+1; renderCart(); openDrawer(); }
function changeQty(idx, d){ cart[idx] = (cart[idx]||0)+d; if(cart[idx]<=0) delete cart[idx]; renderCart(); }

function renderCart(){
  const idxs = Object.keys(cart);
  document.getElementById('cartCount').textContent = idxs.reduce((s,i)=>s+cart[i],0);
  const el = document.getElementById('itemsList');
  el.innerHTML = idxs.length ? idxs.map(idx=>{
    const p = PRODUCTS[idx];
    return `<div class="item"><div class="item-info"><div class="n">${p.name}</div><div class="p">${p.price} EGP</div></div>
      <div class="qty"><button onclick="changeQty(${idx},-1)">−</button><span>${cart[idx]}</span><button onclick="changeQty(${idx},1)">+</button></div></div>`;
  }).join('') : '<div class="empty-state">Your bag is empty.</div>';
  const total = idxs.reduce((s,idx)=>s+cart[idx]*PRODUCTS[idx].price,0);
  document.getElementById('totalPrice').textContent = total + ' EGP';
  document.getElementById('checkoutBtn').disabled = !idxs.length;
}

function openDrawer(){ document.getElementById('drawer').classList.add('open'); document.getElementById('backdrop').classList.add('open'); }
function closeDrawer(){ document.getElementById('drawer').classList.remove('open'); document.getElementById('backdrop').classList.remove('open'); }

async function checkout(){
  const idxs = Object.keys(cart);
  if(!idxs.length) return;
  const statusEl = document.getElementById('orderStatus');
  const btn = document.getElementById('checkoutBtn');
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  if(!phone){ statusEl.textContent='Please add a phone number.'; statusEl.className='order-status err'; return; }
  const items = idxs.map(idx=>({name:PRODUCTS[idx].name, price:PRODUCTS[idx].price, qty:cart[idx]}));
  btn.disabled = true; statusEl.textContent='Placing your order…'; statusEl.className='order-status';
  try{
    const res = await fetch(BACKEND_URL + '/api/order', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({items, customerName:name, customerPhone:phone, address})
    });
    if(!res.ok) throw new Error();
    cart = {}; renderCart();
    document.getElementById('custName').value=''; document.getElementById('custPhone').value=''; document.getElementById('custAddress').value='';
    statusEl.textContent = 'Order placed!'; statusEl.className='order-status ok';
    openNote();
  }catch(err){
    statusEl.textContent = 'Could not place order — try again.'; statusEl.className='order-status err';
  }
  btn.disabled = false;
}

function openNote(){
  document.getElementById('noteText').textContent = SETTINGS.note || "Thanks for your order! We'll be in touch shortly.";
  const backdrop = document.getElementById('noteBackdrop'), btn = document.getElementById('noteContinueBtn');
  backdrop.classList.add('open');
  let seconds = 5; btn.disabled = true; btn.textContent = `Continue (${seconds})`;
  const timer = setInterval(()=>{
    seconds--;
    if(seconds<=0){ clearInterval(timer); btn.disabled=false; btn.textContent='Continue'; }
    else btn.textContent = `Continue (${seconds})`;
  },1000);
}
function closeNote(){
  const btn = document.getElementById('noteContinueBtn');
  if(btn.disabled) return;
  document.getElementById('noteBackdrop').classList.remove('open');
  closeDrawer();
}

load();
</script>
</body>
</html>
